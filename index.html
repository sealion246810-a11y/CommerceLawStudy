<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Year 10 Commerce – Law Practice Test</title>
<style>
:root{--bg:#f4f7fa;--card:#fff;--ink:#17212b;--mute:#5b6773;--line:#d5dde5;--navy:#1f3a5f;--teal:#2a7f8e;--ok:#1d7a46;--okbg:#e3f4ea;--bad:#b3261e;--badbg:#fbe7e5}
@media(prefers-color-scheme:dark){:root{--bg:#10171e;--card:#18222c;--ink:#e8eef3;--mute:#9aa8b5;--line:#2b3946;--navy:#3d6aa3;--teal:#4fb0c0;--ok:#5fd38d;--okbg:#14301f;--bad:#ff8a80;--badbg:#3a1a18}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
main{max-width:720px;margin:0 auto;padding:20px 16px 48px}
header{background:var(--navy);color:#fff;border-radius:12px;padding:18px 20px;margin-bottom:16px}
header h1{margin:0 0 4px;font-size:22px}header p{margin:0;opacity:.9;font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:0 0 14px}
.bar i{display:block;height:100%;background:var(--teal);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--mute);font-size:14px;margin-bottom:6px}
h2{font-size:18px;margin:0 0 14px}
.opt{display:block;width:100%;text-align:left;background:var(--card);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:11px 14px;margin:0 0 9px;font:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--teal)}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.why{margin:12px 0 0;padding:10px 12px;border-radius:10px;background:var(--bg);border-left:4px solid var(--teal);font-size:15px}
button.main{background:var(--navy);color:#fff;border:0;border-radius:10px;padding:11px 20px;font:inherit;font-weight:600;cursor:pointer;margin-top:12px}
button.alt{background:transparent;color:var(--navy);border:1.5px solid var(--navy)}
@media(prefers-color-scheme:dark){button.alt{color:var(--teal);border-color:var(--teal)}}
.score{font-size:42px;font-weight:700;margin:4px 0}
.rev{border-top:1px solid var(--line);padding:12px 0;font-size:15px}
.rev b{display:block;margin-bottom:3px}
.hide{display:none}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.pn{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:18px 20px;max-width:440px;width:100%;max-height:90vh;overflow:auto}
.pn input{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);width:100%}
.row{display:flex;gap:8px;margin-bottom:10px}.row input{flex:1}.row button{margin-top:0}
.opt:disabled{opacity:.55}
</style>
</head>
<body>
<main>
<header><h1>Law Practice Test</h1><p id="sub"></p></header>
<div id="app" class="card"></div>
</main>

const app=document.getElementById('app');
document.getElementById('sub').textContent='Year 10 Commerce · Term 2 · '+Q.length+' multiple-choice questions · choose 15, 30 or all · shuffled each attempt';
const LS='lawRemoved',CODE=3977343546954369;
const hs=s=>{let a=0xdeadbeef,b=0x41c6ce57;for(let k=0;k<s.length;k++){const c=s.charCodeAt(k);a=Math.imul(a^c,2654435761);b=Math.imul(b^c,1597334677)}a=Math.imul(a^(a>>>16),2246822507)^Math.imul(b^(b>>>13),3266489909);b=Math.imul(b^(b>>>16),2246822507)^Math.imul(a^(a>>>13),3266489909);return 4294967296*(2097151&b)+(a>>>0)};
const gone=()=>{try{return JSON.parse(localStorage.getItem(LS)||'[]')}catch(e){return[]}};
const setGone=a=>{try{localStorage.setItem(LS,JSON.stringify(a))}catch(e){}};
const pool=()=>Q.filter(q=>!gone().includes(q[0]));
const shuffle=a=>{a=a.slice();for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]]}return a};
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
let qs=null,i=0,adj=0,unlocked=false,buf='';
const sc=()=>qs.filter(x=>x.done&&x.right).length+adj;
function menu(){
  qs=null;const n=pool().length;
  app.innerHTML=`<h2>Choose a test length</h2><p style="color:var(--mute)">Questions and answer order are shuffled every time.</p>`+[[15,'Quick (15)'],[30,'Standard (30)'],[n,'Full test ('+n+')']].map(a=>`<button class="opt" data-n="${Math.min(a[0],n)}">${a[1]}</button>`).join('');
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>start(+b.dataset.n));
}
function start(n){
  qs=shuffle(pool()).slice(0,n).map(q=>({id:q[0],q:q[0],o:shuffle(q[1].map((t,k)=>({t,ok:k===q[2]}))),e:q[3],done:false,right:false,chosen:-1}));
  i=0;adj=0;show();
}
function show(){
  if(i>=qs.length)return finish();
  const q=qs[i];
  app.innerHTML=`<div class="meta"><span>Question ${i+1} of ${qs.length}</span><span id="sc">Score: ${sc()}</span></div>
  <div class="bar"><i style="width:${i/qs.length*100}%"></i></div>
  <h2>${esc(q.q)}</h2>
  <div id="opts">${q.o.map((o,k)=>`<button class="opt" data-k="${k}">${'ABCD'[k]}. ${esc(o.t)}</button>`).join('')}</div>
  <div id="fb"></div>`;
  app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  if(q.done)fb();
}
function pick(k){const q=qs[i];if(q.done)return;q.done=true;q.chosen=k;q.right=q.o[k].ok;fb()}
function fb(){
  const q=qs[i],btns=[...app.querySelectorAll('.opt')];
  btns.forEach((b,n)=>{b.disabled=true;b.classList.remove('ok','bad');if(q.o[n].ok||(q.right&&n===q.chosen))b.classList.add('ok');else if(n===q.chosen)b.classList.add('bad')});
  const last=i===qs.length-1;
  document.getElementById('fb').innerHTML=`<div class="why"><b>${q.right?'Correct.':'Not quite.'}</b> ${esc(q.e)}</div><button class="main" id="nx">${last?'See results':'Next question'}</button>`;
  document.getElementById('nx').onclick=()=>{i++;show()};
  document.getElementById('sc').textContent='Score: '+sc();
}
function finish(){
  const tot=qs.length,done=qs.filter(x=>x.done).length,wrong=qs.filter(x=>x.done&&!x.right),s=Math.max(0,sc()),pct=tot?Math.round(s/tot*100):0;
  const msg=pct>=85?'Excellent – exam ready.':pct>=65?'Good – review the questions you missed.':'Keep going – revisit the study guide and try again.';
  app.innerHTML=`<h2>Results</h2><div class="score">${s} / ${tot} (${pct}%)</div><p>${msg}</p>
  <button class="main" id="again">Try again</button>
  <h2 style="margin-top:22px">Summary of mistakes${wrong.length?' ('+wrong.length+')':''}</h2>`+
  (wrong.length?`<p style="color:var(--mute);margin-top:-6px">${wrong.length} of ${done} answered questions were incorrect. Revise these topics:</p>`+wrong.map((w,n)=>`<div class="rev"><b>${n+1}. ${esc(w.q)}</b><div style="color:var(--bad)">Your answer: ${esc(w.o[w.chosen].t)}</div><div style="color:var(--ok)">Correct answer: ${esc(w.o.find(o=>o.ok).t)}</div><span style="color:var(--mute)">${esc(w.e)}</span></div>`).join(''):'<p>No mistakes – great work.</p>');
  document.getElementById('again').onclick=menu;
}
/* ---- admin (type "admin" on an answered question) ---- */
addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT'||e.key.length!==1)return;
  buf=(buf+e.key.toLowerCase()).slice(-5);
  if(buf==='admin'){buf='';openAdmin()}
});
function openAdmin(){
  if(!qs||i>=qs.length||!qs[i].done||document.getElementById('adm'))return;
  const m=document.createElement('div');m.id='adm';m.className='modal';document.body.appendChild(m);
  unlocked?panel():gate();
}
const closeAdm=()=>{const m=document.getElementById('adm');if(m)m.remove()};
function gate(){
  const m=document.getElementById('adm');
  m.innerHTML=`<div class="pn"><h2>Admin</h2><input id="pw" type="password" placeholder="Passcode" autocomplete="off"><div id="er" style="color:var(--bad);min-height:20px"></div><button class="main" id="go">Unlock</button> <button class="main alt" id="x">Cancel</button></div>`;
  const go=()=>{if(hs(document.getElementById('pw').value)===CODE){unlocked=true;panel()}else document.getElementById('er').textContent='Incorrect passcode.'};
  document.getElementById('go').onclick=go;document.getElementById('x').onclick=closeAdm;
  document.getElementById('pw').onkeydown=e=>{if(e.key==='Enter')go()};document.getElementById('pw').focus();
}
function panel(){
  const m=document.getElementById('adm'),q=qs[i],g=gone().length;
  m.innerHTML=`<div class="pn"><h2>Admin settings</h2>
  <p style="margin:0 0 10px;color:var(--mute)">Score: ${sc()} · Question ${i+1} of ${qs.length}</p>
  <div class="row"><input id="ns" type="number" min="0" value="${sc()}"><button class="main" id="ss">Set score</button></div>
  <button class="opt" id="mr" ${q.right?'disabled':''}>Mark my answer as correct</button>
  <button class="opt" id="rt">Remove this question from this test</button>
  <button class="opt" id="rb">Remove this question from the question bank (this browser)</button>
  <button class="opt" id="rs" ${g?'':'disabled'}>Restore removed questions (${g})</button>
  <button class="opt" id="fn">Finish test now</button>
  <button class="main alt" id="x">Close</button></div>`;
  const $=id=>document.getElementById(id);
  $('x').onclick=closeAdm;
  $('ss').onclick=()=>{const v=parseInt($('ns').value,10);if(isNaN(v))return;adj+=Math.max(0,v)-sc();document.getElementById('sc').textContent='Score: '+sc();panel()};
  $('mr').onclick=()=>{q.right=true;fb();panel()};
  $('rt').onclick=()=>{qs.splice(i,1);closeAdm();show()};
  $('rb').onclick=()=>{setGone(gone().concat(q.id));qs.splice(i,1);closeAdm();show()};
  $('rs').onclick=()=>{setGone([]);panel()};
  $('fn').onclick=()=>{closeAdm();finish()};
}
menu();
</script>
</body>
</html>
